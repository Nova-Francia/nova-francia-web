services:
  nova-francia:
    image: nginx:latest
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./archives-data/nouvelle-france/files:/usr/share/nginx/html/archives/nouvelle-france/files:ro
      - ./archives-data/nouvelle-france/bluemap:/usr/share/nginx/html/archives/nouvelle-france/bluemap:ro
      - ./archives-data/nova-francia/files:/usr/share/nginx/html/archives/nova-francia/files:ro
      - ./archives-data/nova-francia/bluemap:/usr/share/nginx/html/archives/nova-francia/bluemap:ro
      - ./archives-data/cielbrume/files:/usr/share/nginx/html/archives/cielbrume/files:ro
      - ./archives-data/cielbrume/bluemap:/usr/share/nginx/html/archives/cielbrume/bluemap:ro
    ports:
      - "8080:80"
